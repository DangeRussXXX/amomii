<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AMOMII ONE Command Center</title>

<style>

:root {
    --bg: #080b10;
    --panel: #111720;
    --panel2: #0c1118;
    --border: #263241;
    --text: #e7edf5;
    --muted: #7f8b9a;
    --green: #20e070;
    --red: #ff4d5a;
    --blue: #4da3ff;
    --yellow: #ffd166;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    background: #0b1017;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.subtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
}

.status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
}

.status-dot.online {
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
}

main {
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    gap: 14px;
    padding: 14px;
    min-height: calc(100vh - 76px);
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
}

.panel-title {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--blue);
    font-weight: bold;
    font-size: 13px;
}

.panel-content {
    padding: 14px;
}

button {
    width: 100%;
    background: #18212c;
    border: 1px solid #334152;
    color: var(--text);
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 5px;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    background: #223041;
    border-color: var(--blue);
}

button.primary {
    background: #123b28;
    border-color: var(--green);
}

button.danger {
    background: #3a151a;
    border-color: var(--red);
}

input {
    width: 100%;
    padding: 11px;
    background: #080c11;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: inherit;
    outline: none;
}

input:focus {
    border-color: var(--blue);
}

.command-row {
    display: flex;
    gap: 8px;
}

.command-row input {
    flex: 1;
}

.command-row button {
    width: 90px;
}

.console {
    height: calc(100vh - 230px);
    min-height: 400px;
    overflow-y: auto;
    padding: 14px;
    background: #05080c;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.5;
}

.line {
    margin-bottom: 3px;
}

.rx {
    color: #c9d3df;
}

.tx {
    color: var(--green);
}

.info {
    color: var(--blue);
}

.warn {
    color: var(--yellow);
}

.error {
    color: var(--red);
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #202a35;
}

.stat-name {
    color: var(--muted);
}

.stat-value {
    color: var(--text);
}

.morse-box {
    background: #080c11;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px;
    margin-top: 10px;
}

.morse-message {
    color: var(--yellow);
    font-size: 18px;
    word-break: break-word;
}

.morse-code {
    margin-top: 8px;
    color: var(--green);
    word-break: break-word;
}

.morse-current {
    margin-top: 12px;
    font-size: 28px;
    color: var(--blue);
    text-align: center;
    min-height: 38px;
}

@media (max-width: 1000px) {
    main {
        grid-template-columns: 1fr;
    }

    .console {
        height: 500px;
    }
}

</style>
</head>

<body>

<header>

    <div>
        <div class="title">
            AMOMII ONE COMMAND CENTER
        </div>

        <div class="subtitle">
            WEB CONSOLE • VERSION 1.0
        </div>
    </div>

    <div class="status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">DISCONNECTED</span>
    </div>

</header>


<main>

    <!-- LEFT -->

    <section class="panel">

        <div class="panel-title">
            CONTROL
        </div>

        <div class="panel-content">

            <button id="connectBtn" class="primary">
                CONNECT TO AMOMII
            </button>

            <button id="disconnectBtn">
                DISCONNECT
            </button>

            <br>

            <button onclick="sendCommand('status')">
                STATUS
            </button>

            <button onclick="sendCommand('help')">
                HELP
            </button>

            <button onclick="sendCommand('on')">
                LED ON
            </button>

            <button onclick="sendCommand('off')">
                LED OFF
            </button>

            <button onclick="sendCommand('toggle')">
                TOGGLE
            </button>

            <button onclick="sendCommand('blink 5')">
                BLINK 5
            </button>

            <button onclick="sendCommand('sos')">
                SOS
            </button>

            <button onclick="sendCommand('test')">
                SYSTEM TEST
            </button>

            <button class="danger" onclick="sendCommand('off')">
                STOP / LED OFF
            </button>

        </div>

    </section>


    <!-- CENTER -->

    <section class="panel">

        <div class="panel-title">
            SERIAL CONSOLE
        </div>

        <div id="console" class="console"></div>

        <div class="panel-content">

            <div class="command-row">

                <input
                    id="commandInput"
                    type="text"
                    placeholder="Enter command..."
                    autocomplete="off"
                >

                <button onclick="sendInput()">
                    SEND
                </button>

            </div>

        </div>

    </section>


    <!-- RIGHT -->

    <section>

        <div class="panel">

            <div class="panel-title">
                SYSTEM
            </div>

            <div class="panel-content">

                <div class="stat">
                    <span class="stat-name">Board</span>
                    <span id="board" class="stat-value">
                        AMOMII ONE
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-name">USB</span>
                    <span id="usb" class="stat-value">
                        DISCONNECTED
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-name">Serial</span>
                    <span class="stat-value">
                        9600
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-name">LED</span>
                    <span id="led" class="stat-value">
                        UNKNOWN
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-name">Uptime</span>
                    <span id="uptime" class="stat-value">
                        --
                    </span>
                </div>

                <div class="stat">
                    <span class="stat-name">Commands</span>
                    <span id="commands" class="stat-value">
                        --
                    </span>
                </div>

            </div>

        </div>


        <br>


        <div class="panel">

            <div class="panel-title">
                MORSE TRANSMISSION
            </div>

            <div class="panel-content">

                <div class="morse-box">

                    <div class="stat-name">
                        MESSAGE
                    </div>

                    <div
                        id="morseMessage"
                        class="morse-message"
                    >
                        --
                    </div>

                    <div class="stat-name">
                        CODE
                    </div>

                    <div
                        id="morseCode"
                        class="morse-code"
                    >
                        --
                    </div>

                    <div
                        id="morseCurrent"
                        class="morse-current"
                    >
                        --
                    </div>

                </div>

            </div>

        </div>

    </section>

</main>


<script>

let port = null;
let reader = null;
let writer = null;

let morseMessage = "";
let morseParts = [];

const consoleElement =
    document.getElementById("console");

const input =
    document.getElementById("commandInput");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");


function log(text, type = "rx") {

    const line =
        document.createElement("div");

    line.className = "line " + type;

    const time =
        new Date().toLocaleTimeString();

    line.textContent =
        `[${time}] ${text}`;

    consoleElement.appendChild(line);

    consoleElement.scrollTop =
        consoleElement.scrollHeight;
}


function setConnected(value) {

    if (value) {

        statusDot.classList.add("online");
        statusText.textContent = "CONNECTED";

        document.getElementById("usb")
            .textContent = "CONNECTED";

    } else {

        statusDot.classList.remove("online");
        statusText.textContent = "DISCONNECTED";

        document.getElementById("usb")
            .textContent = "DISCONNECTED";
    }
}


async function connect() {

    if (!("serial" in navigator)) {

        alert(
            "Web Serial is not supported. " +
            "Use Google Chrome or Microsoft Edge."
        );

        return;
    }

    try {

        port =
            await navigator.serial.requestPort();

        await port.open({
            baudRate: 9600
        });

        writer =
            port.writable.getWriter();

        setConnected(true);

        log(
            "Connected to AMOMII ONE.",
            "info"
        );

        readSerial();

    } catch (error) {

        log(
            "Connection error: " + error,
            "error"
        );
    }
}


async function disconnect() {

    try {

        if (reader) {
            await reader.cancel();
            reader.releaseLock();
            reader = null;
        }

        if (writer) {
            writer.releaseLock();
            writer = null;
        }

        if (port) {
            await port.close();
            port = null;
        }

        setConnected(false);

        log(
            "Disconnected.",
            "warn"
        );

    } catch (error) {

        log(
            "Disconnect error: " + error,
            "error"
        );
    }
}


async function readSerial() {

    let buffer = "";

    const decoder =
        new TextDecoder();

    while (port && port.readable) {

        reader =
            port.readable.getReader();

        try {

            while (true) {

                const { value, done } =
                    await reader.read();

                if (done)
                    break;

                buffer +=
                    decoder.decode(
                        value,
                        { stream: true }
                    );

                let lines =
                    buffer.split(/\r?\n/);

                buffer =
                    lines.pop();

                for (const line of lines) {

                    if (line.length > 0) {

                        processSerialLine(line);

                    }
                }
            }

        } catch (error) {

            log(
                "Serial error: " + error,
                "error"
            );

        } finally {

            reader.releaseLock();
            reader = null;
        }
    }
}


function processSerialLine(line) {

    log(line, "rx");

    parseStatus(line);
    parseMorse(line);
}


function parseStatus(line) {

    if (line.includes("LED ON")) {

        document.getElementById("led")
            .textContent = "ON";
    }

    if (line.includes("LED OFF")) {

        document.getElementById("led")
            .textContent = "OFF";
    }

    const uptime =
        line.match(/Uptime:\s*(.+)/i);

    if (uptime) {

        document.getElementById("uptime")
            .textContent = uptime[1];
    }

    const commands =
        line.match(/Commands:\s*(\d+)/i);

    if (commands) {

        document.getElementById("commands")
            .textContent = commands[1];
    }
}


function parseMorse(line) {

    const tx =
        line.match(/MORSE TX:\s*(.+)/i);

    if (tx) {

        morseMessage =
            tx[1];

        document.getElementById(
            "morseMessage"
        ).textContent =
            morseMessage;

        document.getElementById(
            "morseCode"
        ).textContent =
            "--";

        document.getElementById(
            "morseCurrent"
        ).textContent =
            "TRANSMITTING...";
    }


    const character =
        line.match(/^([A-Z0-9]):\s*(.+)$/);

    if (character) {

        const letter =
            character[1];

        const code =
            character[2];

        morseParts.push(code);

        document.getElementById(
            "morseCode"
        ).textContent =
            morseParts.join(" ");

        document.getElementById(
            "morseCurrent"
        ).textContent =
            letter + "  " + code;
    }


    if (
        line.toLowerCase()
            .includes("morse complete")
    ) {

        document.getElementById(
            "morseCurrent"
        ).textContent =
            "TRANSMISSION COMPLETE";

        morseParts = [];
    }
}


async function sendCommand(command) {

    if (!port || !writer) {

        log(
            "Not connected.",
            "error"
        );

        return;
    }

    try {

        const data =
            command + "\n";

        await writer.write(
            new TextEncoder().encode(data)
        );

        log(
            "> " + command,
            "tx"
        );

    } catch (error) {

        log(
            "Send error: " + error,
            "error"
        );
    }
}


function sendInput() {

    const command =
        input.value.trim();

    if (!command)
        return;

    sendCommand(command);

    input.value = "";
}


input.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendInput();

        }

    }
);


document.getElementById("connectBtn")
    .addEventListener(
        "click",
        connect
    );


document.getElementById("disconnectBtn")
    .addEventListener(
        "click",
        disconnect
    );
 
log(
    "AMOMII Web Command Center ready.",
    "info"
);

log(
    "Click CONNECT TO AMOMII.",
    "info"
);

</script>

</body>
</html>
